<!doctype html><html><head><meta charset="utf-8">
<!-- Devpost thumbnail and README cover. Render with: node scripts/cover.mjs (writes docs/img/cover.png, 1500 x 1000). -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1500px;height:1000px;background:#f2eee4;color:#141210;overflow:hidden;font-family:Archivo,sans-serif}
.wrap{display:grid;grid-template-columns:700px 1fr;height:100%;gap:50px;padding:0 0 0 80px;align-items:center}
.brand{font:900 40px/1 Archivo;font-stretch:62%;text-transform:uppercase;border-bottom:4px solid #141210;padding-bottom:14px;margin-bottom:30px;display:flex;justify-content:space-between;align-items:baseline}
.brand span{font:700 15px Archivo;letter-spacing:.12em;text-transform:uppercase;color:#b5320f}
h1{font:900 124px/.84 Archivo;font-stretch:62%;text-transform:uppercase;letter-spacing:-.02em;margin:0 0 34px}
h1 .hl{background:#e8461e;padding:0 .06em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
p{font:italic 400 32px/1.3 Newsreader,serif;color:#3e3933;margin:0;max-width:640px}
.shot{position:relative;height:880px}
.shot::before{content:'';position:absolute;inset:40px 0 -40px 30px;background:#e8461e}
.shot img{position:relative;height:100%;display:block;object-fit:cover;object-position:left top;border:4px solid #141210;border-right:0}
</style></head><body><div class="wrap"><div>
<div class="brand">Stallfront<span>For small sellers</span></div>
<h1>Turn product photos into a <span class="hl">PayPal shop</span> in minutes.</h1>
<p>AI writes the listings. Shoppers pay with PayPal, or ask their AI assistant to shop for them.</p>
</div><div class="shot"><img src="img/shop-assistant.png" alt=""></div></div></body></html>
