<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your order · Stallfront</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 10h18l-1.5-5h-15z"/><path d="M5 10v9h14v-9"/><path d="M10 19v-5h4v5"/></svg>
        Stallfront
      </a>
      <nav><a id="back" href="/">Back to the shop</a></nav>
    </div>
  </header>
  <main class="wrap">
    <article class="receipt" id="receipt" aria-busy="true">
      <p class="caption" style="padding-top:24px">Loading your order…</p>
    </article>
  </main>
  <script type="module">
    const [, , slug, , id] = location.pathname.split('/');
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const money = (c) => `$${(c / 100).toFixed(2)}`;
    const CHANNEL = { webmcp: 'An AI assistant on the shop page', mcp: 'An AI app connected to the shop', web: 'You, on the shop website' };
    document.getElementById('back').href = `/s/${slug}`;

    async function load(refresh) {
      const res = await fetch(`/api/orders/${encodeURIComponent(id)}${refresh ? '?refresh=1' : ''}`);
      const box = document.getElementById('receipt');
      box.removeAttribute('aria-busy');
      if (!res.ok) { box.innerHTML = '<h1 style="margin-top:28px">Order not found</h1><p class="dek">Check the link, or go back to the shop.</p>'; return; }
      const { order: o, shop } = await res.json();
      const status = o.status === 'paid' ? ['paid', 'Paid with PayPal'] : o.status === 'cancelled' ? ['cancelled', 'Cancelled'] : ['waiting', 'Waiting for you to pay in PayPal'];
      box.innerHTML = `
        <div class="rc-top"><span class="status ${status[0]}">${status[1]}</span><span class="kicker" style="margin:0">${esc(shop.name)}</span></div>
        <h1>${o.status === 'paid' ? 'Thank you. Your order is in.' : 'Your order'}</h1>
        <p class="dek">${o.status === 'paid' ? `${esc(shop.name)} has your order. You approved the payment in PayPal and it has gone through.` : `Nothing has been charged yet. Approve the payment in PayPal to complete your order.`}</p>
        <table class="lines"><tbody>
          ${o.items.map((i) => `<tr><td>${esc(i.quantity)} × ${esc(i.title)}</td><td>${money(i.unitCents * i.quantity)}</td></tr>`).join('')}
          <tr><td>Shipping</td><td>${money(o.shippingCents)}</td></tr>
          <tr class="total"><td>Total</td><td>${money(o.totalCents)}</td></tr>
        </tbody></table>
        <dl class="facts">
          <dt>Ordered by</dt><dd>${esc(CHANNEL[o.channel] || o.channel)}</dd>
          <dt>Order number</dt><dd class="mono">${esc(o.id)}</dd>
          <dt>PayPal order</dt><dd class="mono">${esc(o.paypalOrderId)}</dd>
          ${o.captureId ? `<dt>PayPal payment ID</dt><dd class="mono">${esc(o.captureId)}</dd>` : ''}
        </dl>
        ${o.approveUrl ? `<p style="margin-top:20px"><a class="btn btn-paypal" href="${esc(o.approveUrl)}">Review and pay in PayPal</a></p>` : ''}`;
      if (o.status === 'awaiting_buyer' && !refresh) setTimeout(() => load(true), 1500);
    }
    load(false);
  </script>
</body>
</html>
